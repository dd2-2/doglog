name: Deploy Web Preview

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate web platform scaffold
        run: |
          flutter create --platforms=web --org com.petlog --project-name petlog /tmp/petlog_web_scaffold
          cp -r /tmp/petlog_web_scaffold/web .

      - run: flutter pub get

      - name: Generate drift database code
        run: dart run build_runner build --delete-conflicting-outputs

      - run: flutter build web --release --base-href /doglog/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

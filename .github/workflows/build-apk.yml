name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android platform scaffold
        run: |
          flutter create --platforms=android --org com.petlog --project-name petlog /tmp/petlog_scaffold
          cp -r /tmp/petlog_scaffold/android .

      - name: Patch AndroidManifest for local notifications
        run: python3 .github/scripts/patch_manifest.py android/app/src/main/AndroidManifest.xml

      - name: Patch build.gradle for core library desugaring
        run: python3 .github/scripts/patch_gradle.py android/app

      - run: flutter pub get

      - name: Generate drift database code
        run: dart run build_runner build --delete-conflicting-outputs

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: petlog-apk
          path: build/app/outputs/flutter-apk/app-release.apk
